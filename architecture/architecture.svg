<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="900" height="470" fill="#0f1420"/>
  <text x="450" y="34" fill="#e6ebf5" font-size="20" font-weight="700" text-anchor="middle">AI Security Governance &amp; Assurance — Architecture</text>

  <!-- Client -->
  <rect x="40" y="70" width="180" height="90" rx="10" fill="#171e2e" stroke="#2a3450"/>
  <text x="130" y="105" fill="#e6ebf5" font-size="14" font-weight="600" text-anchor="middle">Browser</text>
  <text x="130" y="128" fill="#8a97b3" font-size="12" text-anchor="middle">Dashboard (HTML)</text>
  <text x="130" y="146" fill="#8a97b3" font-size="12" text-anchor="middle">+ JSON API clients</text>

  <!-- FastAPI app -->
  <rect x="300" y="55" width="300" height="360" rx="12" fill="#141b2b" stroke="#5b8cff"/>
  <text x="450" y="82" fill="#5b8cff" font-size="14" font-weight="700" text-anchor="middle">FastAPI application</text>

  <rect x="325" y="100" width="250" height="56" rx="8" fill="#1e2639" stroke="#2a3450"/>
  <text x="450" y="123" fill="#e6ebf5" font-size="13" font-weight="600" text-anchor="middle">Routes</text>
  <text x="450" y="142" fill="#8a97b3" font-size="11" text-anchor="middle">/ dashboard · /api/* JSON</text>

  <rect x="325" y="166" width="250" height="56" rx="8" fill="#1e2639" stroke="#2a3450"/>
  <text x="450" y="189" fill="#e6ebf5" font-size="13" font-weight="600" text-anchor="middle">models.py — Pydantic validation</text>
  <text x="450" y="208" fill="#8a97b3" font-size="11" text-anchor="middle">rejects bad enums / unknown framework ids</text>

  <rect x="325" y="232" width="250" height="56" rx="8" fill="#1e2639" stroke="#2a3450"/>
  <text x="450" y="255" fill="#e6ebf5" font-size="13" font-weight="600" text-anchor="middle">repo.py + scoring.py</text>
  <text x="450" y="274" fill="#8a97b3" font-size="11" text-anchor="middle">queries · inherent/residual risk</text>

  <rect x="325" y="298" width="250" height="56" rx="8" fill="#1e2639" stroke="#2a3450"/>
  <text x="450" y="321" fill="#e6ebf5" font-size="13" font-weight="600" text-anchor="middle">frameworks.py</text>
  <text x="450" y="340" fill="#8a97b3" font-size="11" text-anchor="middle">NIST AI RMF · OWASP LLM · MITRE ATLAS</text>

  <rect x="325" y="364" width="250" height="38" rx="8" fill="#1e2639" stroke="#2a3450"/>
  <text x="450" y="388" fill="#e6ebf5" font-size="12" text-anchor="middle">db.py — sqlite3 data access</text>

  <!-- DB -->
  <rect x="680" y="200" width="180" height="150" rx="10" fill="#171e2e" stroke="#2a3450"/>
  <text x="770" y="230" fill="#e6ebf5" font-size="14" font-weight="600" text-anchor="middle">SQLite</text>
  <text x="770" y="254" fill="#8a97b3" font-size="11" text-anchor="middle">systems · findings</text>
  <text x="770" y="272" fill="#8a97b3" font-size="11" text-anchor="middle">risks · controls</text>
  <text x="770" y="290" fill="#8a97b3" font-size="11" text-anchor="middle">risk_controls</text>
  <text x="770" y="308" fill="#8a97b3" font-size="11" text-anchor="middle">evidence</text>
  <text x="770" y="326" fill="#8a97b3" font-size="11" text-anchor="middle">remediations · retests</text>

  <!-- arrows -->
  <line x1="220" y1="115" x2="300" y2="150" stroke="#5b8cff" stroke-width="2" marker-end="url(#a)"/>
  <line x1="600" y1="275" x2="680" y2="275" stroke="#5b8cff" stroke-width="2" marker-end="url(#a)"/>

  <!-- assurance loop ribbon -->
  <rect x="40" y="210" width="180" height="170" rx="10" fill="#171e2e" stroke="#2a3450"/>
  <text x="130" y="236" fill="#5b8cff" font-size="12" font-weight="700" text-anchor="middle">Assurance loop</text>
  <text x="130" y="262" fill="#e6ebf5" font-size="12" text-anchor="middle">finding</text>
  <text x="130" y="284" fill="#8a97b3" font-size="12" text-anchor="middle">↓ risk</text>
  <text x="130" y="306" fill="#8a97b3" font-size="12" text-anchor="middle">↓ control</text>
  <text x="130" y="328" fill="#8a97b3" font-size="12" text-anchor="middle">↓ evidence</text>
  <text x="130" y="350" fill="#8a97b3" font-size="12" text-anchor="middle">↓ remediation</text>
  <text x="130" y="372" fill="#3fb950" font-size="12" text-anchor="middle">↓ retest</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5b8cff"/>
    </marker>
  </defs>
</svg>
